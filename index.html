<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <!-- Los atributos de formato como border, align o bgcolor están en desuso en HTML5 porque la responsabilidad de HTML es estructurar el contenido, mientras que CSS se encarga de los estilos visuales. -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- table: define una tabla en HTML para estructurar y organizar información en filas y columnas. -->
    <table>
        <caption>Horario de 1ºDAW</caption>
        <!-- tr: define una fila dentro de la tabla. -->
         <tr>
        <!-- th: define una celda de encabezado, cuyo contenido se muestra en negrita y centrado. -->
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
         </tr>
    </table>
    
</body>
</html>
